<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beam Designer</title>
    <style>
      :root {
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --ink: #172033;
        --muted: #667085;
        --line: #e2e8f0;
        --panel: #ffffff;
        --canvas: #f6f8fb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--canvas);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-header {
        height: 68px;
        display: flex;
        align-items: center;
        padding: 0 28px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 750;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        font-size: 15px;
      }

      .layout {
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr);
        gap: 20px;
        max-width: 1500px;
        margin: 0 auto;
        padding: 20px;
      }

      .input-panel,
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(23, 32, 51, 0.055);
      }

      .input-panel {
        align-self: start;
        max-height: calc(100vh - 108px);
        overflow-y: auto;
      }

      .panel-section {
        padding: 17px 18px;
        border-bottom: 1px solid var(--line);
      }

      .panel-section:last-child { border-bottom: 0; }

      .section-title {
        margin: 0 0 12px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .field { margin-bottom: 12px; }
      .field:last-child { margin-bottom: 0; }

      .toggle-row {
        display: flex;
        align-items: flex-start;
        gap: 9px;
      }

      .toggle-row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 2px 0 0;
        accent-color: var(--accent);
        flex: 0 0 auto;
      }

      .toggle-row label {
        margin: 0;
        line-height: 1.35;
        cursor: pointer;
      }

      .self-weight-detail {
        min-height: 16px;
        margin: 6px 0 0 25px;
        color: var(--muted);
        font-size: 12px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 650;
      }

      .unit { color: var(--muted); font-weight: 500; }

      input, select {
        width: 100%;
        height: 38px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        background: white;
        color: var(--ink);
        padding: 0 10px;
        font: inherit;
        font-size: 14px;
        outline: none;
      }

      input:focus, select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #f8fafc;
      }

      .segmented label {
        margin: 0;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        cursor: pointer;
        color: var(--muted);
      }

      .segmented input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .segmented input:checked + span {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: white;
        color: var(--accent);
        box-shadow: 0 1px 4px rgba(23, 32, 51, 0.12);
      }

      .span-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 84px;
        align-items: center;
        gap: 10px;
      }

      input[type="range"] {
        height: 20px;
        padding: 0;
        border: 0;
        accent-color: var(--accent);
      }

      .load-heading,
      .load-actions,
      .load-row,
      .load-grid {
        display: flex;
        align-items: center;
      }

      .load-heading {
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .load-count { color: var(--muted); font-size: 12px; }

      .load-list {
        display: grid;
        gap: 8px;
      }

      .load-card {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfe;
      }

      .load-row {
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 700;
      }

      .load-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .load-grid.uniform { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .load-grid label { margin-bottom: 4px; font-size: 11px; }
      .load-grid input { height: 34px; }

      .icon-button {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 18px;
      }

      .icon-button:hover { background: #fee2e2; color: #b91c1c; }

      .load-actions {
        gap: 8px;
        margin-top: 10px;
      }

      .button {
        min-height: 36px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        background: white;
        color: var(--ink);
        padding: 7px 10px;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: white;
      }

      .button.primary:hover { background: var(--accent-dark); }

      .results { display: grid; gap: 16px; min-width: 0; }

      .drawing-card { padding: 16px; }

      .analysis-stack {
        position: relative;
        display: grid;
        gap: 12px;
      }

      .analysis-stack .drawing-card,
      .analysis-stack .diagram-card {
        --plot-inset: 32px;
      }

      .card-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .card-heading h2 {
        margin: 0;
        font-size: 14px;
      }

      .card-heading span { color: var(--muted); font-size: 12px; }

      .beam-placeholder {
        min-height: 170px;
        display: grid;
        place-items: center;
        margin-inline: var(--plot-inset, 32px);
        border: 1px dashed #cbd5e1;
        border-radius: 9px;
        background:
          linear-gradient(rgba(37,99,235,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(37,99,235,0.035) 1px, transparent 1px);
        background-size: 24px 24px;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
      }

      .diagram-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .diagram-card {
        height: 170px;
        padding: 16px;
      }

      .diagram-placeholder {
        height: 118px;
        display: grid;
        place-items: center;
        margin-inline: var(--plot-inset, 32px);
        border: 1px dashed #cbd5e1;
        border-radius: 8px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      .plot-frame {
        height: 118px;
        margin-inline: var(--plot-inset, 32px);
        border: 1px solid #dfe6ef;
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
      }

      .beam-placeholder.plot-frame {
        display: block;
        min-height: 170px;
        height: 170px;
        padding: 0;
        border-style: solid;
        background: #ffffff;
      }

      .plot-svg {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        user-select: none;
      }

      .hover-readout {
        position: absolute;
        z-index: 4;
        min-width: 180px;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 5px 16px rgba(23, 32, 51, 0.12);
        color: var(--ink);
        font-size: 11px;
        line-height: 1.6;
        pointer-events: none;
        opacity: 0;
      }

      .hover-readout strong {
        display: block;
        margin-bottom: 2px;
        color: var(--accent);
        font-size: 12px;
      }

      .checks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .check-card {
        min-height: 145px;
        padding: 16px;
      }

      .check-card:hover { border-color: #94a3b8; }

      .check-label {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 750;
      }

      .status {
        color: var(--muted);
        font-size: 11px;
      }

      .check-value {
        margin: 18px 0 12px;
        font-size: 22px;
        font-weight: 750;
      }

      .check-value small {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }

      .bar {
        height: 8px;
        overflow: hidden;
        border-radius: 99px;
        background: #e8edf4;
      }

      .bar-fill {
        width: 70%;
        height: 100%;
        border-radius: inherit;
        background: #22c55e;
      }

      .recommendation {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
      }

      .recommendation p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 980px) {
        .layout { grid-template-columns: 285px minmax(0, 1fr); }
        .diagram-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 760px) {
        .layout { grid-template-columns: 1fr; }
        .input-panel { max-height: none; }
        .checks { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">BD</div>
        <span>Beam Designer</span>
      </div>
    </header>

    <main class="layout">
      <aside class="input-panel" aria-label="Beam inputs">
        <section class="panel-section">
          <h2 class="section-title">Beam Setup</h2>
          <div class="field">
            <label>Support type</label>
            <div class="segmented">
              <label>
                <input type="radio" name="support" value="simply-supported" checked>
                <span>Simply supported</span>
              </label>
              <label>
                <input type="radio" name="support" value="cantilever">
                <span>Cantilever</span>
              </label>
            </div>
          </div>

          <div class="field">
            <label for="span-number">Span <span class="unit">(ft)</span></label>
            <div class="span-row">
              <input id="span-slider" type="range" min="4" max="40" step="0.25" value="20" aria-label="Span in feet">
              <input id="span-number" type="number" min="4" max="40" step="0.25" value="20" aria-label="Numeric span in feet">
            </div>
          </div>
        </section>

        <section class="panel-section">
          <div class="load-heading">
            <h2 class="section-title" style="margin:0">Loads</h2>
            <span class="load-count" id="load-count">1 uniform load</span>
          </div>
          <div class="load-list" id="point-load-list"></div>
          <div class="load-list" id="uniform-load-list"></div>
          <div class="load-actions">
            <button class="button" id="add-point" type="button">+ Add point load</button>
            <button class="button" id="add-uniform" type="button">+ Add uniform load</button>
          </div>
        </section>

        <section class="panel-section">
          <h2 class="section-title">Section</h2>
          <div class="field">
            <label for="material">Material</label>
            <select id="material">
              <option value="steel" selected>Steel</option>
              <option value="lumber">Douglas Fir-Larch No. 2 Lumber</option>
            </select>
          </div>
          <div class="field">
            <label for="section">Section</label>
            <select id="section"></select>
          </div>
          <div class="field" id="self-weight-control">
            <div class="toggle-row">
              <input id="include-self-weight" type="checkbox" aria-describedby="self-weight-detail">
              <label for="include-self-weight">Include selected steel beam self-weight</label>
            </div>
            <div class="self-weight-detail" id="self-weight-detail"></div>
          </div>
        </section>

        <section class="panel-section">
          <div class="field">
            <label for="deflection-limit">Deflection limit</label>
            <select id="deflection-limit">
              <option value="240">L/240</option>
              <option value="360" selected>L/360</option>
            </select>
          </div>
        </section>
      </aside>

      <section class="results" aria-label="Beam results">
        <div class="analysis-stack">
          <div class="card drawing-card">
            <div class="card-heading">
              <h2>Beam</h2>
              <span>Loading diagram</span>
            </div>
            <div class="beam-placeholder plot-frame" id="beam-placeholder">
              <svg id="beam-svg" class="plot-svg" role="img" aria-label="Beam loading diagram"></svg>
            </div>
          </div>

          <div class="diagram-grid">
            <div class="card diagram-card">
              <div class="card-heading"><h2>Shear</h2><span>kips</span></div>
              <div class="plot-frame"><svg id="shear-svg" class="plot-svg" role="img" aria-label="Shear diagram"></svg></div>
            </div>
            <div class="card diagram-card">
              <div class="card-heading"><h2>Moment</h2><span>kip-ft</span></div>
              <div class="plot-frame"><svg id="moment-svg" class="plot-svg" role="img" aria-label="Moment diagram"></svg></div>
            </div>
            <div class="card diagram-card">
              <div class="card-heading"><h2>Deflection</h2><span>in</span></div>
              <div class="plot-frame"><svg id="deflection-svg" class="plot-svg" role="img" aria-label="Deflection diagram"></svg></div>
            </div>
          </div>
          <div class="hover-readout" id="hover-readout"></div>
        </div>

        <div class="checks">
          <div class="card check-card" title="Bending check: fb = |M|max × 12 / Sx, compared with the allowable bending stress.">
            <div class="check-label">
              <span>Bending</span>
              <span class="status">NOT CALCULATED</span>
            </div>
            <div class="check-value">— <small>ksi actual</small></div>
            <div class="bar"><div class="bar-fill" style="width:0;background:#cbd5e1"></div></div>
          </div>
          <div class="card check-card" title="Deflection check: |y|max compared with L/240 or L/360, using L in inches.">
            <div class="check-label">
              <span>Deflection</span>
              <span class="status">NOT CALCULATED</span>
            </div>
            <div class="check-value">— <small>in actual</small></div>
            <div class="bar"><div class="bar-fill" style="width:0;background:#cbd5e1"></div></div>
          </div>
        </div>

        <div class="card recommendation">
          <p>Lightest passing section will appear after calculations are implemented.</p>
          <button class="button primary" type="button" disabled>Use lightest passing</button>
        </div>
      </section>
    </main>

    <script>
      const sectionTables = {
        steel: [
          { name: "W8x10", Ix: 30.8, Sx: 7.81, weight: 10 },
          { name: "W10x12", Ix: 53.8, Sx: 10.9, weight: 12 },
          { name: "W12x26", Ix: 204, Sx: 33.4, weight: 26 },
          { name: "W14x22", Ix: 199, Sx: 29.0, weight: 22 },
          { name: "W16x26", Ix: 301, Sx: 38.4, weight: 26 },
          { name: "W18x35", Ix: 510, Sx: 57.6, weight: 35 },
          { name: "W21x44", Ix: 843, Sx: 81.6, weight: 44 },
          { name: "W24x55", Ix: 1350, Sx: 114, weight: 55 }
        ],
        lumber: [
          { name: "2x8", Ix: 47.63, Sx: 13.14 },
          { name: "2x10", Ix: 98.93, Sx: 21.39 },
          { name: "2x12", Ix: 177.98, Sx: 31.64 }
        ]
      };
      const steelSections = sectionTables.steel.map((section) => section.name);
      const lumberSections = sectionTables.lumber.map((section) => section.name);

      const spanSlider = document.getElementById("span-slider");
      const spanNumber = document.getElementById("span-number");
      const materialSelect = document.getElementById("material");
      const sectionSelect = document.getElementById("section");
      const includeSelfWeight = document.getElementById("include-self-weight");
      const selfWeightControl = document.getElementById("self-weight-control");
      const selfWeightDetail = document.getElementById("self-weight-detail");
      const pointList = document.getElementById("point-load-list");
      const uniformList = document.getElementById("uniform-load-list");
      const loadCount = document.getElementById("load-count");

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function syncSpan(source, value) {
        let span = clamp(Number(value) || 4, 4, 40);
        span = Math.round(span * 4) / 4;
        spanSlider.value = span;
        spanNumber.value = span;
      }

      spanSlider.addEventListener("input", () => syncSpan(spanSlider, spanSlider.value));
      spanNumber.addEventListener("input", () => syncSpan(spanNumber, spanNumber.value));
      spanNumber.addEventListener("change", () => syncSpan(spanNumber, spanNumber.value));

      function polygonPositiveLoadIntegral(start, end, x, includeUniform) {
        let result = 0;
        if (includeUniform) {
          const left = Math.max(start, 0);
          const right = Math.min(end, x);
          if (right > left) result += right - left;
        }
        return result;
      }

      function collectModel() {
        const spanFt = Number(spanNumber.value);
        const pointLoads = [...pointList.querySelectorAll(".load-card")].map((card) => ({
          magnitude: Math.max(0, Number(card.querySelector(".point-magnitude").value) || 0),
          positionFt: clamp(Number(card.querySelector(".point-position").value) || 0, 0, spanFt)
        }));
        const uniformLoads = [...uniformList.querySelectorAll(".load-card")].map((card) => {
          let start = clamp(Number(card.querySelector(".uniform-start").value) || 0, 0, spanFt);
          let end = clamp(Number(card.querySelector(".uniform-end").value) || 0, 0, spanFt);
          if (start > end) [start, end] = [end, start];
          return {
            magnitude: Math.max(0, Number(card.querySelector(".uniform-magnitude").value) || 0),
            startFt: start,
            endFt: end
          };
        });
        return {
          support: document.querySelector('input[name="support"]:checked').value,
          spanFt,
          spanIn: spanFt * 12,
          pointLoads,
          uniformLoads,
          deflectionLimit: Number(document.getElementById("deflection-limit").value),
          material: materialSelect.value,
          sectionName: sectionSelect.value,
          includeSelfWeight: materialSelect.value === "steel" && includeSelfWeight.checked
        };
      }

      function calculateBeam(model) {
        const L = model.spanIn;
        const pointLoads = model.pointLoads.map((load) => ({
          P: load.magnitude,
          a: load.positionFt * 12
        }));
        let uniformLoads = model.uniformLoads.map((load) => ({
          w: load.magnitude / 12,
          start: load.startFt * 12,
          end: load.endFt * 12
        }));
        if (model.includeSelfWeight && model.material === "steel") {
          const selectedSection = sectionTables.steel.find((section) => section.name === model.sectionName);
          if (selectedSection) {
            uniformLoads.push({
              w: selectedSection.weight / 1000 / 12,
              start: 0,
              end: L
            });
          }
        }
        const totalPoint = pointLoads.reduce((sum, load) => sum + load.P, 0);
        const totalUniform = uniformLoads.reduce((sum, load) => sum + load.w * (load.end - load.start), 0);
        let reactions;

        if (model.support === "cantilever") {
          reactions = {
            left: totalPoint + totalUniform,
            right: 0,
            moment: pointLoads.reduce((sum, load) => sum + load.P * load.a, 0)
              + uniformLoads.reduce((sum, load) => sum + load.w * ((load.end * load.end - load.start * load.start) / 2), 0)
          };
        } else {
          const leftReaction = pointLoads.reduce((sum, load) => sum + load.P * (L - load.a) / L, 0)
            + uniformLoads.reduce((sum, load) => {
              const segment = Math.max(0, load.end - load.start);
              const midpoint = (load.start + load.end) / 2;
              return sum + load.w * segment * (L - midpoint) / L;
            }, 0);
          reactions = { left: leftReaction, right: totalPoint + totalUniform - leftReaction, moment: 0 };
        }

        function shearAt(x) {
          if (model.support === "cantilever") {
            let shear = reactions.left;
            for (const load of pointLoads) if (load.a <= x) shear -= load.P;
            for (const load of uniformLoads) {
              const overlapStart = load.start;
              const overlapEnd = Math.min(load.end, x);
              if (overlapEnd > overlapStart) shear -= load.w * (overlapEnd - overlapStart);
            }
            return shear;
          }
          let shear = reactions.left;
          for (const load of pointLoads) if (load.a <= x) shear -= load.P;
          for (const load of uniformLoads) {
            const overlapStart = load.start;
            const overlapEnd = Math.min(load.end, x);
            if (overlapEnd > overlapStart) shear -= load.w * (overlapEnd - overlapStart);
          }
          return shear;
        }

        function momentAt(x) {
          if (model.support === "cantilever") {
            let moment = 0;
            for (const load of pointLoads) {
              if (load.a > x) moment -= load.P * (load.a - x);
            }
            for (const load of uniformLoads) {
              const segmentStart = Math.max(load.start, x);
              const segmentEnd = load.end;
              if (segmentEnd > segmentStart) {
                moment -= load.w * (segmentEnd - segmentStart) * ((segmentStart + segmentEnd) / 2 - x);
              }
            }
            return moment;
          }
          let moment = reactions.left * x;
          for (const load of pointLoads) {
            if (x > load.a) moment -= load.P * (x - load.a);
          }
          for (const load of uniformLoads) {
            const overlapStart = load.start;
            const overlapEnd = Math.min(load.end, x);
            if (overlapEnd > overlapStart) {
              const length = overlapEnd - overlapStart;
              const midpoint = (overlapStart + overlapEnd) / 2;
              moment -= load.w * length * (x - midpoint);
            }
          }
          return moment;
        }

        function extremaFor(type) {
          const breakpoints = [0, L];
          for (const load of pointLoads) breakpoints.push(load.a);
          for (const load of uniformLoads) breakpoints.push(load.start, load.end);
          breakpoints.sort((a, b) => a - b);
          const unique = [...new Set(breakpoints.map((x) => Math.round(x * 1e9) / 1e9))];
          const step = 3;
          let candidates = [0, L, ...unique];
          for (let x = 0; x <= L; x += step) candidates.push(x);
          if (type === "moment") {
            for (let x = 0; x < L; x += step) {
              const nextX = Math.min(x + step, L);
              const leftShear = shearAt(x);
              const rightShear = shearAt(nextX);
              if (leftShear * rightShear < 0) {
                let low = x;
                let high = nextX;
                for (let iteration = 0; iteration < 40; iteration++) {
                  const midpoint = (low + high) / 2;
                  if (shearAt(low) * shearAt(midpoint) <= 0) high = midpoint;
                  else low = midpoint;
                }
                candidates.push((low + high) / 2);
              }
            }
          }
          candidates = [...new Set(candidates.filter((x) => x >= 0 && x <= L))];

          let maxValue = -Infinity;
          let minValue = Infinity;
          let maxX = 0;
          let minX = 0;
          for (const x of candidates) {
            const value = type === "shear" ? shearAt(x) : momentAt(x);
            if (value > maxValue) { maxValue = value; maxX = x; }
            if (value < minValue) { minValue = value; minX = x; }
          }
          const extremes = [
            { value: maxValue, absValue: Math.abs(maxValue), x: maxX },
            { value: minValue, absValue: Math.abs(minValue), x: minX }
          ];
          extremes.sort((a, b) => b.absValue - a.absValue || a.x - b.x);
          return extremes[0];
        }

        function deflectionAtLocations(EI) {
          const step = 3;
          const points = [];
          let slope = 0;
          let deflection = 0;
          let previousCurvature = momentAt(0) / EI;
          let previousSlope = 0;
          let previousDeflection = 0;
          points.push({ x: 0, y: 0, slope: 0 });

          for (let x = step; x <= L + 1e-7; x += step) {
            const currentX = Math.min(x, L);
            const curvature = momentAt(currentX) / EI;
            slope = previousSlope + (previousCurvature + curvature) * step / 2;
            deflection = previousDeflection + (previousSlope + slope) * step / 2;
            points.push({ x: currentX, y: deflection, slope });
            previousCurvature = curvature;
            previousSlope = slope;
            previousDeflection = deflection;
          }

          for (const load of pointLoads) {
            if (!points.some((point) => Math.abs(point.x - load.a) < 1e-7)) {
              points.push({ x: load.a, y: null, slope: null });
            }
          }
          for (const load of uniformLoads) {
            for (const x of [load.start, load.end]) {
              if (!points.some((point) => Math.abs(point.x - x) < 1e-7)) {
                points.push({ x, y: null, slope: null });
              }
            }
          }
          points.sort((a, b) => a.x - b.x);
          const reconstructed = [{ x: 0, y: 0, slope: 0 }];
          let prevSlope = 0;
          let prevDeflection = 0;
          let prevCurvature = momentAt(0) / EI;
          let previousX = 0;
          for (let i = 1; i < points.length; i++) {
            const currentX = points[i].x;
            const dx = currentX - previousX;
            if (dx > 0) {
              const curvature = momentAt(currentX) / EI;
              const nextSlope = prevSlope + (prevCurvature + curvature) * dx / 2;
              const nextDeflection = prevDeflection + (prevSlope + nextSlope) * dx / 2;
              reconstructed.push({ x: currentX, y: nextDeflection, slope: nextSlope });
              prevSlope = nextSlope;
              prevDeflection = nextDeflection;
              prevCurvature = curvature;
              previousX = currentX;
            }
          }

          if (model.support === "simply-supported") {
            const correction = reconstructed[reconstructed.length - 1].y / L;
            for (const point of reconstructed) {
              point.y -= correction * point.x;
              point.slope -= correction;
            }
          }
          const signReference = model.support === "simply-supported"
            ? reconstructed.reduce((nearest, point) =>
                Math.abs(point.x - L / 2) < Math.abs(nearest.x - L / 2) ? point : nearest,
              reconstructed[0])
            : reconstructed[reconstructed.length - 1];
          if (signReference.y < 0) {
            for (const point of reconstructed) {
              point.y = -point.y;
              point.slope = -point.slope;
            }
          }
          return reconstructed;
        }

        function deflectionForSection(section) {
          const materialE = model.material === "steel" ? 29000 : 1600;
          const EI = materialE * section.Ix;
          const points = deflectionAtLocations(EI);
          let maximum = { abs: 0, y: 0, x: 0 };
          let maximumIndex = 0;
          for (const point of points) {
            if (Math.abs(point.y) > maximum.abs) {
              maximum = { abs: Math.abs(point.y), y: point.y, x: point.x };
              maximumIndex = points.indexOf(point);
            }
          }
          if (maximumIndex > 0 && maximumIndex < points.length - 1) {
            const left = points[maximumIndex - 1];
            const center = points[maximumIndex];
            const right = points[maximumIndex + 1];
            const hLeft = center.x - left.x;
            const hRight = right.x - center.x;
            if (hLeft > 0 && hRight > 0) {
              const denominator = hLeft * hRight * (hLeft + hRight);
              const a = (hLeft * (right.y - center.y) - hRight * (center.y - left.y)) / denominator;
              const b = (hRight * hRight * (center.y - left.y) + hLeft * hLeft * (right.y - center.y)) / denominator;
              if (Math.abs(a) > 1e-12) {
                const offset = -b / (2 * a);
                if (offset > -hLeft && offset < hRight) {
                  const interpolatedX = center.x + offset;
                  const interpolatedY = a * offset * offset + b * offset + center.y;
                  if (Math.abs(interpolatedY) > maximum.abs) {
                    maximum = { abs: Math.abs(interpolatedY), y: interpolatedY, x: interpolatedX };
                  }
                }
              }
            }
          }
          return { points, maximum };
        }

        return {
          model,
          reactions,
          shearAt,
          momentAt,
          extremaFor,
          deflectionForSection
        };
      }

      function sectionByName(material, name) {
        return sectionTables[material].find((section) => section.name === name);
      }

      function evaluateSection(model, section) {
        const candidateModel = {
          ...model,
          sectionName: section.name,
          includeSelfWeight: model.includeSelfWeight && model.material === "steel"
        };
        const analysis = calculateBeam(candidateModel);
        const shearExtreme = analysis.extremaFor("shear");
        const momentExtreme = analysis.extremaFor("moment");
        const maxMomentKipIn = Math.abs(momentExtreme.absValue);
        const maxMomentKipFt = maxMomentKipIn / 12;
        const bendingStress = maxMomentKipIn / section.Sx;
        const allowableBending = model.material === "steel" ? 30 : 0.9;
        const deflection = analysis.deflectionForSection(section);
        const allowableDeflection = analysis.model.spanIn / model.deflectionLimit;
        return {
          analysis,
          shearExtreme,
          momentExtreme,
          maxMomentKipFt,
          bendingStress,
          allowableBending,
          deflection,
          allowableDeflection,
          bendingPass: bendingStress <= allowableBending,
          deflectionPass: deflection.maximum.abs <= allowableDeflection
        };
      }

      function findLightestPassing(model) {
        if (model.material === "steel") {
          const passing = sectionTables.steel
            .filter((section) => {
              const result = evaluateSection(model, section);
              return result.bendingPass && result.deflectionPass;
            })
            .sort((a, b) =>
              a.weight - b.weight ||
              b.Ix - a.Ix
            );
          return passing[0] || null;
        }
        return sectionTables.lumber.find((section) => {
          const result = evaluateSection(model, section);
          return result.bendingPass && result.deflectionPass;
        }) || null;
      }

      function ratioColor(ratio) {
        if (ratio < 0.7) return "#22c55e";
        if (ratio <= 1) return "#f59e0b";
        return "#ef4444";
      }

      const SVG_NS = "http://www.w3.org/2000/svg";
      const plotGeometry = { left: 50, right: 750, width: 800, height: 118 };

      function svgElement(tag, attributes = {}, text = "") {
        const element = document.createElementNS(SVG_NS, tag);
        for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, value);
        if (text) element.textContent = text;
        return element;
      }

      function clearSvg(svg) {
        while (svg.firstChild) svg.removeChild(svg.firstChild);
      }

      function plotX(xIn, spanIn) {
        return plotGeometry.left + (xIn / spanIn) * (plotGeometry.right - plotGeometry.left);
      }

      function renderBeamDrawing(model, result) {
        const svg = document.getElementById("beam-svg");
        clearSvg(svg);
        svg.setAttribute("viewBox", "0 0 800 170");

        const yBeam = 92;
        const left = plotGeometry.left;
        const right = plotGeometry.right;
        const spanIn = model.spanIn;

        svg.appendChild(svgElement("line", {
          x1: left, y1: yBeam, x2: right, y2: yBeam,
          stroke: "#334155", "stroke-width": 8, "stroke-linecap": "round"
        }));

        if (model.support === "cantilever") {
          svg.appendChild(svgElement("rect", {
            x: left - 18, y: 54, width: 18, height: 76,
            fill: "#e2e8f0", stroke: "#64748b", "stroke-width": 2
          }));
          for (let y = 58; y < 126; y += 10) {
            svg.appendChild(svgElement("line", {
              x1: left - 18, y1: y, x2: left - 4, y2: y + 14,
              stroke: "#94a3b8", "stroke-width": 2
            }));
          }
        } else {
          const supportLeft = [
            `${left},${yBeam + 4}`,
            `${left - 16},${yBeam + 30}`,
            `${left + 16},${yBeam + 30}`
          ].join(" ");
          const supportRight = [
            `${right},${yBeam + 4}`,
            `${right - 16},${yBeam + 30}`,
            `${right + 16},${yBeam + 30}`
          ].join(" ");
          svg.appendChild(svgElement("polygon", { points: supportLeft, fill: "#dbeafe", stroke: "#2563eb", "stroke-width": 2 }));
          svg.appendChild(svgElement("circle", { cx: right, cy: yBeam + 4, r: 8, fill: "#dbeafe", stroke: "#2563eb", "stroke-width": 2 }));
          svg.appendChild(svgElement("line", { x1: right - 18, y1: yBeam + 30, x2: right + 18, y2: yBeam + 30, stroke: "#64748b", "stroke-width": 3 }));
        }

        for (const [loadIndex, load] of model.pointLoads.entries()) {
          const x = plotX(load.positionFt * 12, spanIn);
          const loadGroup = svgElement("g", {
            "data-point-index": loadIndex,
            style: "cursor: ew-resize"
          });
          loadGroup.appendChild(svgElement("line", {
            x1: x, y1: 32, x2: x, y2: yBeam - 8,
            stroke: "#2563eb", "stroke-width": 3, "marker-end": "url(#arrowhead)"
          }));
          loadGroup.appendChild(svgElement("path", {
            d: `M ${x - 7} ${yBeam - 18} L ${x} ${yBeam - 8} L ${x + 7} ${yBeam - 18} Z`,
            fill: "#2563eb"
          }));
          loadGroup.appendChild(svgElement("circle", {
            cx: x, cy: yBeam - 8, r: 12,
            fill: "transparent", stroke: "none"
          }));
          loadGroup.appendChild(svgElement("text", {
            x, y: 24, "text-anchor": "middle",
            fill: "#1d4ed8", "font-size": 12, "font-weight": 700
          }, `${load.magnitude.toFixed(2)} k`));
          svg.appendChild(loadGroup);
        }

        for (const load of model.uniformLoads) {
          const startX = plotX(load.startFt * 12, spanIn);
          const endX = plotX(load.endFt * 12, spanIn);
          const arrowCount = Math.max(3, Math.min(20, Math.ceil((endX - startX) / 28)));
          for (let i = 0; i <= arrowCount; i++) {
            const x = startX + (endX - startX) * i / arrowCount;
            svg.appendChild(svgElement("line", {
              x1: x, y1: 38, x2: x, y2: yBeam - 10,
              stroke: "#2563eb", "stroke-width": 2
            }));
            svg.appendChild(svgElement("path", {
              d: `M ${x - 5} ${yBeam - 18} L ${x} ${yBeam - 10} L ${x + 5} ${yBeam - 18} Z`,
              fill: "#2563eb"
            }));
          }
          svg.appendChild(svgElement("text", {
            x: (startX + endX) / 2, y: 24, "text-anchor": "middle",
            fill: "#1d4ed8", "font-size": 12, "font-weight": 700
          }, `${load.magnitude.toFixed(2)} k/ft`));
        }

        if (model.includeSelfWeight && model.material === "steel") {
          const section = sectionByName("steel", model.sectionName);
          if (section) {
            const startX = left;
            const endX = right;
            const kipsPerFt = section.weight / 1000;
            const arrowCount = 20;
            for (let i = 0; i <= arrowCount; i++) {
              const x = startX + (endX - startX) * i / arrowCount;
              svg.appendChild(svgElement("line", {
                x1: x, y1: 58, x2: x, y2: yBeam - 10,
                stroke: "#64748b", "stroke-width": 1.5
              }));
              svg.appendChild(svgElement("path", {
                d: `M ${x - 4} ${yBeam - 18} L ${x} ${yBeam - 10} L ${x + 4} ${yBeam - 18} Z`,
                fill: "#64748b"
              }));
            }
            svg.appendChild(svgElement("text", {
              x: (startX + endX) / 2, y: 50, "text-anchor": "middle",
              fill: "#475569", "font-size": 11, "font-weight": 700
            }, `Self-weight ${kipsPerFt.toFixed(3)} k/ft`));
          }
        }

        if (model.support === "simply-supported") {
          svg.appendChild(svgElement("line", {
            x1: left, y1: yBeam + 34, x2: right, y2: yBeam + 34,
            stroke: "#94a3b8", "stroke-width": 1
          }));
          svg.appendChild(svgElement("text", { x: left, y: yBeam + 48, "text-anchor": "middle", fill: "#64748b", "font-size": 11 }, "0 ft"));
          svg.appendChild(svgElement("text", { x: right, y: yBeam + 48, "text-anchor": "middle", fill: "#64748b", "font-size": 11 }, `${model.spanFt.toFixed(2)} ft`));

          const leftX = left;
          const rightX = right;
          svg.appendChild(svgElement("line", { x1: leftX, y1: 138, x2: leftX, y2: 112, stroke: "#16a34a", "stroke-width": 3, "marker-end": "url(#reaction-arrow)" }));
          svg.appendChild(svgElement("line", { x1: rightX, y1: 138, x2: rightX, y2: 112, stroke: "#16a34a", "stroke-width": 3 }));
          svg.appendChild(svgElement("path", { d: `M ${leftX - 6} 118 L ${leftX} 112 L ${leftX + 6} 118 Z`, fill: "#16a34a" }));
          svg.appendChild(svgElement("path", { d: `M ${rightX - 6} 118 L ${rightX} 112 L ${rightX + 6} 118 Z`, fill: "#16a34a" }));
          svg.appendChild(svgElement("text", { x: leftX, y: 152, "text-anchor": "middle", fill: "#166534", "font-size": 12, "font-weight": 700 }, `${result.analysis.reactions.left.toFixed(2)} k`));
          svg.appendChild(svgElement("text", { x: rightX, y: 152, "text-anchor": "middle", fill: "#166534", "font-size": 12, "font-weight": 700 }, `${result.analysis.reactions.right.toFixed(2)} k`));
        } else {
          svg.appendChild(svgElement("text", { x: left, y: yBeam + 48, "text-anchor": "middle", fill: "#64748b", "font-size": 11 }, "Fixed"));
          svg.appendChild(svgElement("text", { x: right, y: yBeam + 48, "text-anchor": "middle", fill: "#64748b", "font-size": 11 }, `${model.spanFt.toFixed(2)} ft`));
          svg.appendChild(svgElement("line", { x1: left, y1: 138, x2: left, y2: 112, stroke: "#16a34a", "stroke-width": 3 }));
          svg.appendChild(svgElement("path", { d: `M ${left - 6} 118 L ${left} 112 L ${left + 6} 118 Z`, fill: "#16a34a" }));
          svg.appendChild(svgElement("text", { x: left + 8, y: 152, "text-anchor": "start", fill: "#166534", "font-size": 12, "font-weight": 700 }, `${result.analysis.reactions.left.toFixed(2)} k`));
          svg.appendChild(svgElement("text", { x: left + 8, y: 164, "text-anchor": "start", fill: "#166534", "font-size": 11 }, `M = ${(result.analysis.reactions.moment / 12).toFixed(2)} kip-ft`));
        }

        svg.onpointerdown = (event) => {
          const rect = svg.getBoundingClientRect();
          const viewX = ((event.clientX - rect.left) / rect.width) * 800;
          if (viewX < plotGeometry.left || viewX > plotGeometry.right) return;

          let nearestIndex = -1;
          let nearestDistance = Infinity;
          model.pointLoads.forEach((load, index) => {
            const loadX = plotX(load.positionFt * 12, spanIn);
            const distance = Math.abs(viewX - loadX);
            if (distance < nearestDistance) {
              nearestDistance = distance;
              nearestIndex = index;
            }
          });
          if (nearestIndex < 0 || nearestDistance > 24) return;

          event.preventDefault();

          function movePoint(moveEvent) {
            const currentRect = svg.getBoundingClientRect();
            const currentViewX = ((moveEvent.clientX - currentRect.left) / currentRect.width) * 800;
            const fraction = clamp((currentViewX - plotGeometry.left) / (plotGeometry.right - plotGeometry.left), 0, 1);
            const snappedFt = Math.round((fraction * model.spanFt) * 4) / 4;
            const cards = [...pointList.querySelectorAll(".load-card")];
            const positionInput = cards[nearestIndex]?.querySelector(".point-position");
            if (positionInput) {
              positionInput.value = snappedFt.toFixed(2);
              updateCalculations();
            }
          }

          movePoint(event);
          function stopPoint() {
            window.removeEventListener("pointermove", movePoint);
            window.removeEventListener("pointerup", stopPoint);
          }
          window.addEventListener("pointermove", movePoint);
          window.addEventListener("pointerup", stopPoint);
        };
      }

      function renderDiagram(svgId, model, result, type) {
        const svg = document.getElementById(svgId);
        clearSvg(svg);
        svg.setAttribute("viewBox", "0 0 800 118");

        const left = plotGeometry.left;
        const right = plotGeometry.right;
        const baseline = 59;
        const spanIn = model.spanIn;
        const stepIn = 3;
        const points = [];

        for (let x = 0; x <= spanIn + 1e-7; x += stepIn) {
          const xIn = Math.min(x, spanIn);
          let value;
          if (type === "shear") value = result.analysis.shearAt(xIn);
          if (type === "moment") value = result.analysis.momentAt(xIn) / 12;
          if (type === "deflection") {
            const section = sectionByName(model.material, model.sectionName);
            const deflection = result.deflection.points.find((point) => Math.abs(point.x - xIn) < 1.1);
            value = deflection ? deflection.y : 0;
          }
          points.push({ xIn, value });
        }

        if (type === "shear") {
          for (const load of model.pointLoads) {
            const epsilon = 0.001;
            const xIn = load.positionFt * 12;
            points.push({ xIn: xIn - epsilon, value: result.analysis.shearAt(xIn - epsilon) });
            points.push({ xIn: xIn + epsilon, value: result.analysis.shearAt(xIn + epsilon) });
          }
          for (const load of model.uniformLoads) {
            points.push({ xIn: load.startFt * 12, value: result.analysis.shearAt(load.startFt * 12) });
            points.push({ xIn: load.endFt * 12, value: result.analysis.shearAt(load.endFt * 12) });
          }
        } else if (type === "moment") {
          for (const load of model.pointLoads) {
            points.push({ xIn: load.positionFt * 12, value: result.analysis.momentAt(load.positionFt * 12) / 12 });
          }
          for (const load of model.uniformLoads) {
            points.push({ xIn: load.startFt * 12, value: result.analysis.momentAt(load.startFt * 12) / 12 });
            points.push({ xIn: load.endFt * 12, value: result.analysis.momentAt(load.endFt * 12) / 12 });
          }
        }
        points.sort((a, b) => a.xIn - b.xIn);
        points.forEach((point) => { point.x = plotX(point.xIn, spanIn); });

        let maxAbs = 0;
        for (const point of points) maxAbs = Math.max(maxAbs, Math.abs(point.value));
        maxAbs = maxAbs || 1;
        const scale = 38 / maxAbs;

        svg.appendChild(svgElement("line", { x1: left, y1: baseline, x2: right, y2: baseline, stroke: "#94a3b8", "stroke-width": 1 }));
        svg.appendChild(svgElement("line", { x1: left, y1: 16, x2: left, y2: 102, stroke: "#e2e8f0", "stroke-width": 1 }));
        svg.appendChild(svgElement("line", { x1: right, y1: 16, x2: right, y2: 102, stroke: "#e2e8f0", "stroke-width": 1 }));

        const polygonPoints = [
          `${left},${baseline}`,
          ...points.map((point) => `${point.x.toFixed(2)},${(baseline - point.value * scale).toFixed(2)}`),
          `${right},${baseline}`
        ].join(" ");
        svg.appendChild(svgElement("polygon", {
          points: polygonPoints,
          fill: type === "deflection" ? "rgba(37,99,235,0.14)" : "rgba(37,99,235,0.18)",
          stroke: "none"
        }));

        if (points.length > 1) {
          const pathData = points.map((point, index) =>
            `${index === 0 ? "M" : "L"} ${point.x.toFixed(2)} ${(baseline - point.value * scale).toFixed(2)}`
          ).join(" ");
          svg.appendChild(svgElement("path", {
            d: pathData, fill: "none", stroke: "#2563eb", "stroke-width": 2,
            "stroke-linejoin": "round"
          }));
        }

        let extreme;
        if (type === "shear") extreme = result.shearExtreme;
        if (type === "moment") extreme = { value: result.momentExtreme.value / 12, absValue: Math.abs(result.momentExtreme.value / 12), x: result.momentExtreme.x };
        if (type === "deflection") extreme = { value: result.deflection.maximum.y, absValue: result.deflection.maximum.abs, x: result.deflection.maximum.x };
        if (extreme) {
          const extremeX = plotX(extreme.x, spanIn);
          const extremeValue = type === "deflection" ? extreme.value : extreme.value;
          const y = baseline - extremeValue * scale;
          const labelUnit = type === "shear" ? "k" : type === "moment" ? "kip-ft" : "in";
          svg.appendChild(svgElement("circle", { cx: extremeX, cy: y, r: 4, fill: "#ffffff", stroke: "#2563eb", "stroke-width": 2 }));
          const label = `${Math.abs(extreme.absValue).toFixed(type === "deflection" ? 3 : 2)} ${labelUnit} @ ${(extreme.x / 12).toFixed(2)} ft`;
          svg.appendChild(svgElement("text", {
            x: Math.min(right - 2, Math.max(left + 2, extremeX)),
            y: Math.max(14, y - 8),
            "text-anchor": extremeX > right - 100 ? "end" : "start",
            fill: "#1d4ed8", "font-size": 11, "font-weight": 700
          }, label));
        }

        svg.appendChild(svgElement("text", { x: left, y: 112, "text-anchor": "middle", fill: "#64748b", "font-size": 10 }, "0 ft"));
        svg.appendChild(svgElement("text", { x: right, y: 112, "text-anchor": "middle", fill: "#64748b", "font-size": 10 }, `${model.spanFt.toFixed(2)} ft`));
        svg.dataset.type = type;
      }

      function showHoverLine(event) {
        const model = collectModel();
        const section = sectionByName(model.material, model.sectionName);
        if (!section) return;
        const result = evaluateSection(model, section);
        const svg = event.currentTarget;
        const rect = svg.getBoundingClientRect();
        const viewX = ((event.clientX - rect.left) / rect.width) * 800;
        const selectedX = Math.min(plotGeometry.right, Math.max(plotGeometry.left, viewX));
        const fraction = (selectedX - plotGeometry.left) / (plotGeometry.right - plotGeometry.left);
        const xIn = fraction * model.spanIn;
        const xFt = xIn / 12;
        const pixelX = plotX(xIn, model.spanIn);

        document.querySelectorAll(".plot-svg").forEach((plot) => {
          if (!plot.querySelector(".hover-line")) {
            plot.appendChild(svgElement("line", {
              class: "hover-line",
              y1: plot.id === "beam-svg" ? 16 : 16,
              y2: plot.id === "beam-svg" ? 154 : 102,
              stroke: "#64748b",
              "stroke-width": 1,
              "stroke-dasharray": "4 3",
              opacity: 0,
              "pointer-events": "none"
            }));
          }
          const line = plot.querySelector(".hover-line");
          line.setAttribute("x1", pixelX);
          line.setAttribute("x2", pixelX);
          line.setAttribute("opacity", "1");
        });

        const deflection = result.deflection.points.reduce((nearest, point) =>
          Math.abs(point.x - xIn) < Math.abs(nearest.x - xIn) ? point : nearest,
        result.deflection.points[0]);
        const readout = document.getElementById("hover-readout");
        readout.innerHTML =
          `<strong>x = ${xFt.toFixed(2)} ft</strong>` +
          `V = ${result.analysis.shearAt(xIn).toFixed(2)} k<br>` +
          `M = ${(result.analysis.momentAt(xIn) / 12).toFixed(2)} kip-ft<br>` +
          `y = ${deflection.y.toFixed(3)} in`;
        readout.style.opacity = "1";

        const stackRect = document.querySelector(".analysis-stack").getBoundingClientRect();
        let left = event.clientX - stackRect.left + 12;
        let top = event.clientY - stackRect.top + 12;
        left = Math.min(stackRect.width - 205, Math.max(8, left));
        top = Math.min(stackRect.height - 90, Math.max(8, top));
        readout.style.left = `${left}px`;
        readout.style.top = `${top}px`;
      }

      function hideHoverLine() {
        document.querySelectorAll(".hover-line").forEach((line) => line.setAttribute("opacity", "0"));
        const readout = document.getElementById("hover-readout");
        readout.style.opacity = "0";
      }

      function bindHoverLines() {
        document.querySelectorAll(".plot-svg").forEach((svg) => {
          svg.onmousemove = showHoverLine;
          svg.onmouseleave = hideHoverLine;
        });
      }

      function updateCalculations() {
        const model = collectModel();
        const section = sectionByName(model.material, model.sectionName);
        if (!section) return;
        const result = evaluateSection(model, section);
        const bendingCard = document.querySelectorAll(".check-card")[0];
        const deflectionCard = document.querySelectorAll(".check-card")[1];
        const bendingStatus = bendingCard.querySelector(".status");
        const deflectionStatus = deflectionCard.querySelector(".status");
        const bendingValue = bendingCard.querySelector(".check-value");
        const deflectionValue = deflectionCard.querySelector(".check-value");
        const bendingRatio = result.bendingStress / result.allowableBending;
        const deflectionRatio = result.deflection.maximum.abs / result.allowableDeflection;

        bendingStatus.textContent = result.bendingPass ? "PASS" : "FAIL";
        bendingStatus.style.color = result.bendingPass ? "#166534" : "#b91c1c";
        bendingValue.innerHTML = `${result.bendingStress.toFixed(2)} <small>ksi actual / ${result.allowableBending.toFixed(3)} ksi allowable</small>`;
        const bendingBar = bendingCard.querySelector(".bar-fill");
        bendingBar.style.width = `${Math.min(bendingRatio * 100, 100)}%`;
        bendingBar.style.background = ratioColor(bendingRatio);

        deflectionStatus.textContent = result.deflectionPass ? "PASS" : "FAIL";
        deflectionStatus.style.color = result.deflectionPass ? "#166534" : "#b91c1c";
        deflectionValue.innerHTML = `${result.deflection.maximum.abs.toFixed(3)} <small>in actual / ${result.allowableDeflection.toFixed(3)} in allowable</small>`;
        const deflectionBar = deflectionCard.querySelector(".bar-fill");
        deflectionBar.style.width = `${Math.min(deflectionRatio * 100, 100)}%`;
        deflectionBar.style.background = ratioColor(deflectionRatio);

        const recommendation = document.querySelector(".recommendation");
        const recommendationText = recommendation.querySelector("p");
        const recommendationButton = recommendation.querySelector("button");
        const lightest = findLightestPassing(model);
        if (lightest) {
          recommendationText.textContent = `${lightest.name} is the lightest passing section for the selected material.`;
          recommendationButton.disabled = false;
          recommendationButton.dataset.section = lightest.name;
        } else {
          recommendationText.textContent = "No section in the selected material passes both checks.";
          recommendationButton.disabled = true;
          recommendationButton.dataset.section = "";
        }

        document.querySelector(".recommendation button").onclick = () => {
          if (recommendationButton.dataset.section) sectionSelect.value = recommendationButton.dataset.section;
          updateCalculations();
        };

        renderBeamDrawing(model, result);
        renderDiagram("shear-svg", model, result, "shear");
        renderDiagram("moment-svg", model, result, "moment");
        renderDiagram("deflection-svg", model, result, "deflection");
        bindHoverLines();
      }

      function updateSections() {
        const sections = materialSelect.value === "steel" ? steelSections : lumberSections;
        sectionSelect.replaceChildren();
        sections.forEach((name) => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          sectionSelect.appendChild(option);
        });
        sectionSelect.value = materialSelect.value === "steel" ? "W12x26" : "2x8";
        if (materialSelect.value === "lumber") includeSelfWeight.checked = false;
        includeSelfWeight.disabled = materialSelect.value !== "steel";
        selfWeightControl.style.opacity = materialSelect.value === "steel" ? "1" : "0.55";
        updateSelfWeightDetail();
      }

      function updateSelfWeightDetail() {
        if (materialSelect.value !== "steel") {
          selfWeightDetail.textContent = "Unavailable for lumber.";
          return;
        }
        const section = sectionByName("steel", sectionSelect.value);
        if (!section) {
          selfWeightDetail.textContent = "";
          return;
        }
        const kipsPerFt = section.weight / 1000;
        selfWeightDetail.textContent = `${section.name}: ${kipsPerFt.toFixed(3)} kips/ft`;
      }

      materialSelect.addEventListener("change", updateSections);
      sectionSelect.addEventListener("change", () => {
        updateSelfWeightDetail();
        updateCalculations();
      });
      includeSelfWeight.addEventListener("change", updateCalculations);
      updateSections();

      function positiveInput(input, fallback = 0) {
        input.addEventListener("input", () => {
          const value = Number(input.value);
          if (input.value !== "" && value < 0) input.value = fallback;
        });
      }

      function updateLoadCount() {
        const pointCount = pointList.querySelectorAll(".load-card").length;
        const uniformCount = uniformList.querySelectorAll(".load-card").length;
        const parts = [];
        if (pointCount) parts.push(`${pointCount} point ${pointCount === 1 ? "load" : "loads"}`);
        if (uniformCount) parts.push(`${uniformCount} uniform ${uniformCount === 1 ? "load" : "loads"}`);
        loadCount.textContent = parts.length ? parts.join(", ") : "No loads";
      }

      function removeLoad(button) {
        button.closest(".load-card").remove();
        updateLoadCount();
        updateCalculations();
      }

      function addPointLoad(magnitude = 10, position = 10) {
        const card = document.createElement("div");
        card.className = "load-card";
        card.innerHTML = `
          <div class="load-row">
            <span>Point load</span>
            <button class="icon-button" type="button" title="Remove point load" aria-label="Remove point load">×</button>
          </div>
          <div class="load-grid">
            <div>
              <label>Magnitude <span class="unit">(kips)</span></label>
              <input class="point-magnitude" type="number" min="0" step="0.1" value="${magnitude}">
            </div>
            <div>
              <label>Position <span class="unit">(ft)</span></label>
              <input class="point-position" type="number" min="0" max="${spanNumber.value}" step="0.25" value="${position}">
            </div>
          </div>`;
        pointList.appendChild(card);
        const magnitudeInput = card.querySelector(".point-magnitude");
        const positionInput = card.querySelector(".point-position");
        positiveInput(magnitudeInput);
        magnitudeInput.addEventListener("input", updateCalculations);
        magnitudeInput.addEventListener("change", updateCalculations);
        positionInput.addEventListener("input", () => {
          positionInput.value = clamp(Number(positionInput.value) || 0, 0, Number(spanNumber.value));
          updateCalculations();
        });
        positionInput.addEventListener("change", updateCalculations);
        card.querySelector(".icon-button").addEventListener("click", (event) => removeLoad(event.currentTarget));
        updateLoadCount();
        updateCalculations();
      }

      function addUniformLoad(magnitude = 1, start = 0, end = 20) {
        const card = document.createElement("div");
        card.className = "load-card";
        card.innerHTML = `
          <div class="load-row">
            <span>Uniform load</span>
            <button class="icon-button" type="button" title="Remove uniform load" aria-label="Remove uniform load">×</button>
          </div>
          <div class="load-grid uniform">
            <div>
              <label>Magnitude <span class="unit">(kips/ft)</span></label>
              <input class="uniform-magnitude" type="number" min="0" step="0.01" value="${magnitude}">
            </div>
            <div>
              <label>Start <span class="unit">(ft)</span></label>
              <input class="uniform-start" type="number" min="0" max="${spanNumber.value}" step="0.25" value="${start}">
            </div>
            <div>
              <label>End <span class="unit">(ft)</span></label>
              <input class="uniform-end" type="number" min="0" max="${spanNumber.value}" step="0.25" value="${end}">
            </div>
          </div>`;
        uniformList.appendChild(card);
        const magnitudeInput = card.querySelector(".uniform-magnitude");
        const startInput = card.querySelector(".uniform-start");
        const endInput = card.querySelector(".uniform-end");
        positiveInput(magnitudeInput);
        magnitudeInput.addEventListener("input", updateCalculations);
        magnitudeInput.addEventListener("change", updateCalculations);

        function normalizeEndpoints() {
          let start = clamp(Number(startInput.value) || 0, 0, Number(spanNumber.value));
          let end = clamp(Number(endInput.value) || 0, 0, Number(spanNumber.value));
          if (start > end) [start, end] = [end, start];
          startInput.value = start;
          endInput.value = end;
          updateCalculations();
        }

        startInput.addEventListener("input", updateCalculations);
        endInput.addEventListener("input", updateCalculations);
        startInput.addEventListener("change", normalizeEndpoints);
        endInput.addEventListener("change", normalizeEndpoints);
        card.querySelector(".icon-button").addEventListener("click", (event) => removeLoad(event.currentTarget));
        updateLoadCount();
        updateCalculations();
      }

      document.getElementById("add-point").addEventListener("click", () => {
        const support = document.querySelector('input[name="support"]:checked').value;
        addPointLoad(0, support === "cantilever" ? Number(spanNumber.value) : Number(spanNumber.value) / 2);
      });

      document.getElementById("add-uniform").addEventListener("click", () => {
        addUniformLoad(0, 0, Number(spanNumber.value));
      });

      document.querySelectorAll('input[name="support"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          pointList.querySelectorAll(".point-position").forEach((input) => {
            input.max = spanNumber.value;
          });
          uniformList.querySelectorAll(".uniform-start, .uniform-end").forEach((input) => {
            input.max = spanNumber.value;
          });
        });
      });

      spanNumber.addEventListener("input", () => {
        pointList.querySelectorAll(".point-position").forEach((input) => input.max = spanNumber.value);
        uniformList.querySelectorAll(".uniform-start, .uniform-end").forEach((input) => input.max = spanNumber.value);
      });

      addUniformLoad(1, 0, 20);

      document.querySelectorAll("input, select").forEach((control) => {
        control.addEventListener("input", updateCalculations);
        control.addEventListener("change", updateCalculations);
      });

      materialSelect.addEventListener("change", () => {
        updateSections();
        updateCalculations();
      });

      function runValidationCases() {
        const cases = [
          {
            name: "Simply supported uniform",
            model: { support: "simply-supported", spanFt: 20, spanIn: 240, pointLoads: [], uniformLoads: [{ magnitude: 1, startFt: 0, endFt: 20 }], deflectionLimit: 360, material: "steel", sectionName: "W12x26", includeSelfWeight: false },
            section: sectionTables.steel.find((section) => section.name === "W12x26")
          },
          {
            name: "Simply supported off-center point",
            model: { support: "simply-supported", spanFt: 20, spanIn: 240, pointLoads: [{ magnitude: 10, positionFt: 5 }], uniformLoads: [], deflectionLimit: 360, material: "steel", sectionName: "W12x26", includeSelfWeight: false },
            section: sectionTables.steel.find((section) => section.name === "W12x26")
          },
          {
            name: "Cantilever point",
            model: { support: "cantilever", spanFt: 10, spanIn: 120, pointLoads: [{ magnitude: 5, positionFt: 10 }], uniformLoads: [], deflectionLimit: 360, material: "steel", sectionName: "W12x26", includeSelfWeight: false },
            section: sectionTables.steel.find((section) => section.name === "W12x26")
          },
          {
            name: "Lumber uniform",
            model: { support: "simply-supported", spanFt: 12, spanIn: 144, pointLoads: [], uniformLoads: [{ magnitude: 0.05, startFt: 0, endFt: 12 }], deflectionLimit: 360, material: "lumber", sectionName: "2x10", includeSelfWeight: false },
            section: sectionTables.lumber.find((section) => section.name === "2x10")
          },
          {
            name: "Simply supported W12x26 self-weight only",
            model: { support: "simply-supported", spanFt: 20, spanIn: 240, pointLoads: [], uniformLoads: [], deflectionLimit: 360, material: "steel", sectionName: "W12x26", includeSelfWeight: true },
            section: sectionTables.steel.find((section) => section.name === "W12x26")
          },
          {
            name: "Simply supported W12x26 external plus self-weight",
            model: { support: "simply-supported", spanFt: 20, spanIn: 240, pointLoads: [], uniformLoads: [{ magnitude: 1, startFt: 0, endFt: 20 }], deflectionLimit: 360, material: "steel", sectionName: "W12x26", includeSelfWeight: true },
            section: sectionTables.steel.find((section) => section.name === "W12x26")
          },
          {
            name: "Cantilever W12x26 self-weight only",
            model: { support: "cantilever", spanFt: 10, spanIn: 120, pointLoads: [], uniformLoads: [], deflectionLimit: 360, material: "steel", sectionName: "W12x26", includeSelfWeight: true },
            section: sectionTables.steel.find((section) => section.name === "W12x26")
          },
          {
            name: "Section change W12x26/W10x12 self-weight",
            model: { support: "simply-supported", spanFt: 20, spanIn: 240, pointLoads: [], uniformLoads: [], deflectionLimit: 360, material: "steel", sectionName: "W12x26", includeSelfWeight: true },
            section: sectionTables.steel.find((section) => section.name === "W12x26")
          },
          {
            name: "Steel-to-lumber self-weight off",
            model: { support: "simply-supported", spanFt: 12, spanIn: 144, pointLoads: [], uniformLoads: [{ magnitude: 0.05, startFt: 0, endFt: 12 }], deflectionLimit: 360, material: "lumber", sectionName: "2x10", includeSelfWeight: false },
            section: sectionTables.lumber.find((section) => section.name === "2x10")
          }
        ];

        return cases.map((test) => {
          const result = evaluateSection(test.model, test.section);
          return {
            name: test.name,
            reactions: result.analysis.reactions,
            shearExtreme: result.shearExtreme,
            momentExtreme: result.momentExtreme,
            momentKipFt: result.maxMomentKipFt,
            bendingStress: result.bendingStress,
            deflection: result.deflection.maximum.abs,
            deflectionLocationFt: result.deflection.maximum.x / 12,
            allowableDeflection: result.allowableDeflection,
            bendingPass: result.bendingPass,
            deflectionPass: result.deflectionPass,
            includeSelfWeight: test.model.includeSelfWeight,
            sectionWeightKipsFt: test.model.material === "steel"
              ? test.section.weight / 1000
              : null,
            candidateComparison: test.name === "Section change W12x26/W10x12 self-weight"
              ? ["W12x26", "W10x12"].map((name) => {
                  const candidate = sectionTables.steel.find((section) => section.name === name);
                  const candidateResult = evaluateSection(test.model, candidate);
                  return {
                    name,
                    weightKipsFt: candidate.weight / 1000,
                    momentKipFt: candidateResult.maxMomentKipFt,
                    bendingStress: candidateResult.bendingStress,
                    deflection: candidateResult.deflection.maximum.abs,
                    bendingPass: candidateResult.bendingPass,
                    deflectionPass: candidateResult.deflectionPass
                  };
                })
              : null
          };
        });
      }

      window.BeamDesigner = {
        calculateBeam,
        evaluateSection,
        findLightestPassing,
        runValidationCases
      };

      updateCalculations();
      window.beamValidationResults = runValidationCases();
      console.table(window.beamValidationResults);
    </script>
  </body>
</html>
